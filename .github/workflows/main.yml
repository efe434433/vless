name: Xray Binary + Cloudflared

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kurulum
      run: |
        sudo apt update
        sudo apt install -y curl wget unzip

    - name: Xray Binary İndir
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip
        chmod +x xray
        sudo mv xray /usr/local/bin/
        xray version

    - name: Xray Config ve Başlat
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        echo "UUID=$UUID" >> $GITHUB_ENV
        echo "✅ UUID: $UUID"
        
        cat << EOF > config.json
        {
          "inbounds": [{
            "port": 10000,
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "${UUID}"}],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": {"path": "/"}
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        
        nohup xray run -config config.json > xray.log 2>&1 &
        sleep 3
        echo "✅ Xray başlatıldı"
        cat xray.log

    - name: Cloudflared Kur
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        cloudflared --version

    - name: Cloudflared Tunnel Başlat
      run: |
        # Tunnel'ı başlat ve log'u kaydet
        nohup cloudflared tunnel --url http://localhost:10000 > tunnel.log 2>&1 &
        
        echo "⏳ Cloudflared başlatılıyor..."
        sleep 12
        
        # URL'yi log'dan al - YENİ FORMAT
        TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
        
        if [ -z "$TUNNEL_URL" ]; then
          echo "❌ URL bulunamadı! Loglar:"
          cat tunnel.log
          exit 1
        fi
        
        echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        echo "✅ Tunnel URL: $TUNNEL_URL"

    - name: VLESS URL Oluştur
      run: |
        UUID="${{ env.UUID }}"
        TUNNEL_URL="${{ env.TUNNEL_URL }}"
        
        HOST=$(echo "$TUNNEL_URL" | sed 's|https://||')
        VLESS_URL="vless://${UUID}@${HOST}:443?path=/&security=tls&encryption=none&host=${HOST}&type=ws#Xray-Tunnel"
        
        echo "VLESS_URL=$VLESS_URL" >> $GITHUB_ENV
        
        ENCODED=$(echo -n "$VLESS_URL" | base64 -w 0)
        echo "ENCODED=$ENCODED" >> $GITHUB_ENV
        
        echo "$VLESS_URL" > vless-url.txt
        echo "$TUNNEL_URL" > tunnel-url.txt
        
        echo "=========================================="
        echo "✅ VLESS URL OLUŞTURULDU!"
        echo "=========================================="
        echo ""
        echo "🔗 Tunnel URL:"
        echo "$TUNNEL_URL"
        echo ""
        echo "📱 VLESS URL (v2rayN/Nekoray için):"
        echo "$VLESS_URL"
        echo ""
        echo "📱 QR Code:"
        echo "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=$ENCODED"
        echo ""
        echo "=========================================="

    - name: Artifacts Yükle
      uses: actions/upload-artifact@v4
      with:
        name: xray-config
        path: |
          vless-url.txt
          tunnel-url.txt
        retention-days: 7

    - name: Tunnel'ı Canlı Tut
      run: |
        echo "=========================================="
        echo "⏳ XRAY + CLOUDFLARED ÇALIŞIYOR"
        echo "=========================================="
        echo ""
        echo "🔗 Tunnel URL: ${{ env.TUNNEL_URL }}"
        echo "📱 VLESS URL: ${{ env.VLESS_URL }}"
        echo ""
        echo "⏰ Kalan süre: ~6 saat"
        echo "🛑 Durdurmak için: workflow'u cancel et"
        echo "=========================================="
        
        while true; do
          sleep 60
          # Cloudflared hala çalışıyor mu kontrol et
          if ! pgrep -f "cloudflared tunnel" > /dev/null; then
            echo "❌ Cloudflared durdu! Loglar:"
            cat tunnel.log
            exit 1
          fi
          # Xray hala çalışıyor mu kontrol et
          if ! pgrep -f "xray run" > /dev/null; then
            echo "❌ Xray durdu!"
            cat xray.log
            exit 1
          fi
        done
