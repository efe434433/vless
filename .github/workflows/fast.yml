name: Xray HIZLI TUNNEL ⚡

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Sistem Optimize
      run: |
        sudo apt update
        sudo apt install -y curl wget unzip
        
        # DNS
        echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
        
        # Kernel
        sudo sysctl -w net.core.rmem_max=134217728
        sudo sysctl -w net.core.wmem_max=134217728
        sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 134217728"
        sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 134217728"
        sudo sysctl -w net.core.default_qdisc=fq
        sudo sysctl -w net.ipv4.tcp_congestion_control=bbr

    - name: Xray Kur
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip
        chmod +x xray
        sudo mv xray /usr/local/bin/
        
        UUID=$(cat /proc/sys/kernel/random/uuid)
        echo "UUID=$UUID" >> $GITHUB_ENV

    - name: Xray Config (gRPC + Vision)
      run: |
        cat << EOF > config.json
        {
          "inbounds": [{
            "port": 10000,
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "${{ env.UUID }}"}],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "grpc",
              "grpcSettings": {
                "serviceName": "vless"
              }
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        
        nohup xray run -config config.json -cpus 4 > xray.log 2>&1 &
        sleep 3

    - name: Cloudflared (Hızlı)
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
        nohup cloudflared tunnel --url http://localhost:10000 \
          --protocol http2 \
          --ha-connections 4 \
          > tunnel.log 2>&1 &
        
        sleep 10
        
        URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
        echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

    - name: VLESS URL (gRPC)
      run: |
        HOST=$(echo "${{ env.TUNNEL_URL }}" | sed 's|https://||')
        VLESS="vless://${{ env.UUID }}@$HOST:443?security=tls&encryption=none&host=$HOST&type=grpc&serviceName=vless#HIZLI"
        
        echo "=========================================="
        echo "⚡ HIZLI VLESS URL (gRPC):"
        echo "$VLESS"
        echo "=========================================="
        echo ""
        echo "QR: https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=$(echo -n "$VLESS" | base64 -w 0)"
        
        echo "$VLESS" > vless-url.txt

    - name: Canlı Tut
      run: |
        echo "⚡ ÇALIŞIYOR: ${{ env.TUNNEL_URL }}"
        echo "⏰ 6 saat süper hızlı internet!"
        sleep infinity
